name: Create Release

on:
  push:
    tags:
      - 'v*'    # Triggers on tags like v1.5.8, v1.5.9, etc.
      - '[0-9]*' # Also triggers on tags like 1.5.8, 1.5.9, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version from tag
        id: tag_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Remove 'v' prefix if present
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
      
      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          # Extract changelog entry for this version
          CHANGELOG=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | head -n -1)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create plugin zip file
        id: create_zip
        run: |
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          ZIP_NAME="ksm-extensions.zip"
          BUILD_DIR="build/ksm-extensions"

          mkdir -p "${BUILD_DIR}"
          rsync -a ./ "${BUILD_DIR}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.wp-ai' \
            --exclude '.agent-skills' \
            --exclude 'node_modules' \
            --exclude 'demos' \
            --exclude 'dist' \
            --exclude 'tests' \
            --exclude 'agents.md' \
            --exclude 'development.md' \
            --exclude 'BUILD-SUMMARY.md' \
            --exclude 'PLUGIN-SAFETY-ANALYSIS.md' \
            --exclude 'AUDIT-REPORT*.md' \
            --exclude 'audit-*.md' \
            --exclude 'fix-*.php' \
            --exclude '.gitignore' \
            --exclude '*.zip'

          (cd build && zip -r "../${ZIP_NAME}" ksm-extensions)

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.tag_version.outputs.VERSION }}
          body: |
            ## Version ${{ steps.tag_version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: ${{ steps.create_zip.outputs.ZIP_PATH }}
          draft: false
          prerelease: false

